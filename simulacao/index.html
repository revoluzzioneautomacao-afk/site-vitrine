  c.fillText('EXTRUSORA', xExt+wExt/2, yMaq+hMaq/2);

  // silo
  const x0 = xSilo, y0 = yTop, siloH = alt*0.62;
  const nivel = Math.max(0, Math.min(1, p[1]/5000));
  roundRect(c, x0, y0, wSilo, siloH, 6);
  c.fillStyle = '#111F38'; c.fill(); c.strokeStyle='#2F4A75'; c.lineWidth=1.4; c.stroke();
  const hFill = (siloH-6)*nivel;
  c.fillStyle = 'rgba(183,140,255,0.55)';
  c.fillRect(x0+3, y0+3+(siloH-6-hFill), wSilo-6, hFill);
  c.beginPath(); c.moveTo(x0, y0+siloH); c.lineTo(x0+wSilo/2, y0+siloH+22); c.lineTo(x0+wSilo, y0+siloH); c.closePath();
  c.fillStyle='#111F38'; c.fill(); c.strokeStyle='#2F4A75'; c.stroke();
  c.fillStyle = '#C9D8EC'; c.font='700 10px -apple-system,Segoe UI,Roboto,Arial'; c.textAlign='center';
  c.fillText('SILO', x0+wSilo/2, y0-8);
  c.fillStyle = '#B78CFF'; c.font='700 11px -apple-system,Segoe UI,Roboto,Arial';
  c.fillText(p[1].toLocaleString('pt-BR')+' kg', x0+wSilo/2, y0+siloH+40);

  // esteira 1 (faixa abaixo das máquinas)
  const lane = yMaq + hMaq + 16;
  c.strokeStyle='#23385C'; c.lineWidth=3;
  c.beginPath(); c.moveTo(xSilo+wSilo/2, y0+siloH+22); c.lineTo(xSilo+wSilo/2, lane);
  c.lineTo(xEmp + 7*(wMaq+espaco), lane); c.stroke();

  // empacotadeiras
  for(let k=0;k<7;k++){
    const x = xEmp + k*(wMaq+espaco);
    maquina(c, x, yMaq, wMaq, hMaq, k < p[2], 'EMP '+(k+1));
    if(k < p[2]){
      const yy = yMaq + hMaq*((fase*0.6 + k*0.13) % 1);
      c.fillStyle='rgba(61,214,140,0.85)';
      c.beginPath(); c.arc(x+wMaq/2, yy, 2.6, 0, 7); c.fill();
    }
  }
  c.fillStyle='#94A9C4'; c.font='600 11px -apple-system,Segoe UI,Roboto,Arial'; c.textAlign='left';
  c.fillText('EMPACOTAMENTO  '+p[2]+'/7', xEmp, yMaq-10);

  // esteira 2 -> enfardadeiras
  const xFimEmp = xEmp + 7*(wMaq+espaco);
  const xEnf = Math.min(xFimEmp + 30, W - 4*(46+8) - 20);
  const yEnf = yMaq + hMaq + 46, hEnf = Math.min(64, alt*0.3);
  c.strokeStyle='#23385C'; c.beginPath(); c.moveTo(xFimEmp, lane);
  c.lineTo(xEnf-6, lane); c.lineTo(xEnf-6, yEnf+hEnf/2); c.lineTo(xEnf-2, yEnf+hEnf/2); c.stroke();

  const wEnf = Math.min(46, (W - xEnf - 20)/4 - 8);
  for(let k=0;k<4;k++){
    const x = xEnf + k*(wEnf+8);
    maquina(c, x, yEnf, wEnf, hEnf, k < p[3], 'ENF '+(k+1));
  }
  c.fillStyle='#94A9C4'; c.font='600 11px -apple-system,Segoe UI,Roboto,Arial';
  c.fillText('ENFARDAMENTO  '+p[3]+'/4', xEnf, yEnf-8);

  // produto na esteira
  for(let k=0;k<16;k++){
    const t = ((fase*0.6 + k/16) % 1);
    const px = (xSilo+wSilo/2) + t*(xEmp + 7*(wMaq+espaco) - (xSilo+wSilo/2));
    c.fillStyle = 'rgba(248,128,0,0.9)';
    c.beginPath(); c.arc(px, lane, 3.4, 0, 7); c.fill();
  }

  // rodape
  c.fillStyle='#7C90AB'; c.font='11px -apple-system,Segoe UI,Roboto,Arial'; c.textAlign='left';
  c.fillText('Simulação SimPy · dados do Controle Industrial de outubro/2026', 18, H-14);
  c.textAlign='right';
  c.fillStyle='#61D9FF';
  c.fillText('hora '+p[0].toFixed(0)+' h · '+p[4].toFixed(0)+' t empacotadas', W-18, H-14);
}

function tick(t){
  if(rodando){
    if(!ultimo) ultimo=t;
    const dt=(t-ultimo)/1000;
    fase = (fase + dt*0.6) % 1;
    i += Math.max(1, Math.round(dt*vel*3));
    if(i>=D.length-1){i=D.length-1;rodando=false;$('play').textContent='↺ Recomeçar';}
    atualiza(); ultimo=t;
  } else ultimo=0;
  requestAnimationFrame(tick);
}

function atualiza(){
  const p=D[i];
  $('k1').textContent = p[0].toFixed(0)+' h';
  $('k2').textContent = p[4].toFixed(0)+' t';
  $('k3').textContent = p[1].toLocaleString('pt-BR')+' kg';
  $('k4').textContent = p[2]+'/7 · '+p[3]+'/4';
  $('seek').value = i;
  desenhar();
}

$('play').onclick=()=>{ if(i>=D.length-1)i=0; rodando=!rodando; $('play').textContent=rodando?'❚❚ Pausar':'▶ Rodar'; };
$('seek').oninput=e=>{ i=+e.target.value; fase=(i%40)/40; atualiza(); };
$('vel').onchange=e=>{ vel=+e.target.value; };
let tr; window.onresize=()=>{clearTimeout(tr);tr=setTimeout(desenhar,120);};
atualiza(); requestAnimationFrame(tick);
</script></div></body></html>
